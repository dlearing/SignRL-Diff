# ===========================================================================
# SignRL-Diff Default Configuration
# ===========================================================================
# This YAML defines all hyperparameters for the three-phase training
# pipeline: Phase 1 (VAE + Diffusion pre-training), Phase 2 (SRN reward
# model training), and Phase 3 (RL fine-tuning via PPO).
# ===========================================================================

# ---------------------------------------------------------------------------
# Diffusion UNet
# ---------------------------------------------------------------------------
model:
  unet_channels: [128, 256, 512, 512]   # channel progression per resolution level
  lora_rank: 16                          # LoRA rank for attention projections
  lora_alpha: 16.0                       # LoRA scaling factor
  latent_dim: 4                          # VAE latent channels
  latent_size: 32                        # VAE latent spatial H=W
  text_dim: 1024                         # text embedding dimensionality
  cond_dim: 512                          # timestep embedding dimensionality
  num_heads: 8                           # attention heads in UNet
  num_frames: 16                         # temporal frames in latent video

# ---------------------------------------------------------------------------
# VAE
# ---------------------------------------------------------------------------
vae:
  latent_channels: 4
  base_channels: 64
  kl_weight: 1.0e-4

# ---------------------------------------------------------------------------
# Diffusion Scheduler
# ---------------------------------------------------------------------------
diffusion:
  num_train_steps: 1000
  beta_schedule: linear         # linear | cosine
  beta_start: 1.0e-4
  beta_end: 0.02

# ---------------------------------------------------------------------------
# Sub-Reward Network (SRN)
# ---------------------------------------------------------------------------
srn:
  gcn_channels: [3, 64, 128, 128]    # GCN layer progression
  tcn_channels: 256                   # TCN hidden channels
  tcn_layers: 6                       # number of dilated causal conv layers
  tcn_kernel_size: 3
  hand_crop_size: 128                 # spatial size of hand crops
  num_joints: 148                     # SMPL-X joint count
  video_emb_dim: 1024                 # video embedding dimensionality
  text_emb_dim: 512                   # CLIP text embedding dimensionality

# ---------------------------------------------------------------------------
# HAR (Hierarchical Articulation-Aware Reward)
# ---------------------------------------------------------------------------
har:
  gate_hidden_dim: 256                # MLP_gate hidden layer size
  gamma: 0.99                         # discount factor for intermediate rewards
  text_dim: 1024                      # text condition dimensionality for gate

# ---------------------------------------------------------------------------
# RL (PPO)
# ---------------------------------------------------------------------------
rl:
  gamma: 0.99                         # MDP discount factor
  gae_lambda: 0.95                    # GAE lambda
  clip_epsilon: 0.2                   # PPO clipping epsilon
  lr: 3.0e-5                          # learning rate (actor + critic)
  epochs: 4                           # PPO epochs per rollout
  mini_batch: 64                      # mini-batch size for PPO updates
  rollout_steps: 50                   # steps per rollout collection
  num_envs: 4                         # parallel vectorised environments
  total_steps: 200000                 # total RL training steps
  value_coeff: 0.5                    # value loss weight c1
  entropy_coeff: 0.01                 # entropy bonus weight c2
  max_grad_norm: 0.5                  # gradient clipping threshold
  cfg_scale_default: 7.5             # default classifier-free guidance scale
  cfg_scale_range: 2.0               # +/- modulation range for CFG scale

# ---------------------------------------------------------------------------
# Training Schedule (3 phases)
# ---------------------------------------------------------------------------
training:
  phase1_steps: 500000               # VAE + diffusion pre-training steps
  phase2_steps: 50000                # SRN reward model training steps
  phase3_steps: 200000               # RL fine-tuning steps
  batch_size: 4                       # training batch size
  gpus: 4                             # number of GPUs
  lr_phase1: 1.0e-4                  # learning rate for phase 1
  lr_phase2: 3.0e-5                  # learning rate for phase 2
  weight_decay: 0.01
  grad_clip: 1.0
  log_interval: 100                   # steps between log entries
  save_interval: 5000                 # steps between checkpoints
  eval_interval: 2000                 # steps between evaluations

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  datasets:
    - PHOENIX14T
    - How2Sign
    - USTC-CSL
  num_frames: 32                      # frames per video clip
  resolution: 256                     # spatial resolution (HxW)
  text_emb_dim: 1024                  # CLIP embedding dimensionality
  max_text_length: 77                 # max token length for CLIP
  num_workers: 8                      # DataLoader workers
  pin_memory: true

# ---------------------------------------------------------------------------
# Paths (override via CLI or environment)
# ---------------------------------------------------------------------------
paths:
  data_root: ./data
  checkpoint_dir: ./checkpoints
  log_dir: ./logs
  pretrained_unet: null               # path to pretrained UNet weights
  pretrained_vae: null                # path to pretrained VAE weights
  pretrained_clip: null               # path to pretrained CLIP model

# ---------------------------------------------------------------------------
# Logging / Experiment Tracking
# ---------------------------------------------------------------------------
logging:
  project: signrl-diff
  entity: null                        # W&B entity (null = default)
  run_name: null                      # auto-generated if null
  use_wandb: true
  use_tensorboard: false
